[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "horus"
version = "0.1.0"
description = "Efficient real-time tennis ball tracking and near-real-time shot metrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "h5py>=3.10",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "tqdm>=4.66",
    "torch>=2.1",
    "torchvision>=0.16",
    "tensorboard>=2.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*", "tracking*", "trajectories*"]
