[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horus"
version = "0.1.0"
description = "Neuromorphic tennis ball tracker — RGB, frame-diff, and event-camera modalities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
  "h5py>=3.10",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
eval = ["fvcore>=0.1.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["horus*"]

[tool.setuptools.package-data]
horus = ["py.typed"]
