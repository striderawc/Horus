# Horus data pipeline configuration

paths:
  raw_dataset: Dataset
  processed_root: data/processed
  events_subdir: events

# Original TrackNet video properties
source:
  width: 1280
  height: 720
  fps: 30

# Training resolution (coords/heatmaps scaled to this)
image:
  width: 640
  height: 360

sequence:
  # Number of frames in an RGB/diff/event window (TrackNet-style)
  length: 3
  # Label is taken from the last frame in the window
  label_frame: last

splits:
  train: [game1, game2, game3, game4, game5, game6, game7]
  val: [game8, game9]
  test: [game10]

heatmap:
  sigma: 2.5
  # Peak value of the Gaussian (TrackNet uses 1.0)
  amplitude: 1.0

# Track-gated / jittered crops for detector training (full-frame when disabled).
crop:
  enabled: false
  buckets: [64, 128, 256]
  # Offset ~ N(0, frac * size) from ball center for positive crops
  jitter_std_frac: 0.15
  negative_prob: 0.2
  # Ball must sit this many px inside the crop to count as positive
  min_ball_margin: 4
  # Detector peak threshold for accepting a measurement (closed loop)
  peak_thresh: 0.3
  # Weight on Gaussian NLL (coord residual / predicted σ) during training
  nll_weight: 0.1

frame_diff:
  # absolute | signed
  mode: absolute
  # grayscale before differencing
  grayscale: true

v2e:
  # CLI binary (must be on PATH after installing SensorsINI/v2e)
  executable: v2e
  input_frame_rate: 30
  disable_slomo: true
  skip_video_output: true
  # Downscale for manageable event storage (null = keep source size)
  output_width: 640
  output_height: 360
  # DVS preset: clean | noisy | null
  dvs_params: clean
  # Extra args appended to the CLI (list of strings).
  # Wrapper always adds: --overwrite --unique_output_folder false --no_preview
  extra_args: []

events:
  # Event-frame representation: 2 channels (pos, neg) per time window
  event_frame:
    channels: polarity  # polarity | count
  # Voxel grid over each frame interval (and stacked across sequence)
  voxel:
    num_bins: 5
  # Time span of one original frame at source fps
  frame_dt: 0.0333333333

dataloader:
  batch_size: 4
  num_workers: 2
  shuffle_train: true

# Stage-1 trackers (horus.track): cv_kf / cv_akf / ca_akf / cv_pf.
# dt: null → 1 / source.fps. r_meas is measurement std (px) for R = r^2 I.
tracker:
  dt: null
  q_pos: 1.0
  q_vel: 10.0
  q_acc: 50.0          # CA process noise on ax/ay (ca_akf)
  r_meas: 5.0
  init_pos_std: 10.0
  init_vel_std: 50.0
  init_acc_std: 100.0  # CA initial accel std (ca_akf)
  # Adaptive KF (cv_akf / ca_akf) — learns Q, R online
  akf_forgetting: 0.95
  akf_q_min: 1.0e-4
  akf_r_min: 0.25
  akf_q_max_scale: 100.0
  akf_r_max_scale: 100.0
  # Particle filter (ConstantVelocityPF / build_pf)
  n_particles: 500
  ess_ratio: 0.5
  pf_seed: null




# Event-frame SNN (scripts/train_snn.py). steps = snn.steps or sequence.length.
# Shallow 2-LIF encoder at full resolution → 1×1 head → sigmoid heatmap.
# Train loss is MSE vs a small disk of 1s around the ball (snn.circle_radius).
# Eval factory hardcodes defaults.
snn:
  beta: 0.9
  threshold: 1.0
  base: 16
  # Temporal unroll length (null = sequence.length)
  steps: null
  # Pixel radius of the binary target circle for circle_mse loss
  circle_radius: 3.0
  # Ablation: feed the same event frame every timestep (e,e,…,e) instead of (e1…eT).
  # Label is that single frame. Pair with steps to control how many times it is tiled.
  repeat_frame: false

# Hyperparams for scripts/train_cnn.py and scripts/train_snn.py (CLI flags override these)
train:
  epochs: 20
  lr: 0.001
  batch_size: 4
  num_workers: 2
  # CNN: Euclidean px / image diagonal. SNN: circle MSE (see snn.circle_radius).
  checkpoint_dir: checkpoints
  # Optional .pt filename under checkpoint_dir (null = script defaults, e.g. event_frame_snn.pt)
  checkpoint_name: null
  # TensorBoard root; each run writes runs/<name>/<utc-timestamp>/
  log_dir: runs
  # Step scalars (loss, grad_norm, lr) every N optimizer steps
  log_every: 50
